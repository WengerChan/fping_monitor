# fping_monitor 全局配置
interval: 60                  # 检测周期（秒）。必须 >= 2× 一轮 fping 耗时（避免节奏漂移）
failure_threshold: 3          # 连续失败多少次才判定 DOWN
recovery_threshold: 2         # 连续成功多少次才恢复 UP

database: data/state.db       # SQLite 路径（相对 WORKDIR）

# fping 选项：每个周期一次批量化调用
# timeout_ms 按目标类型选：局域网 200，多机房 500-1000，公网/国际 1000-2000
# 一轮耗时 ≈ count × (timeout_ms + interval_ms) + 1s 启动，1000 台通常 < 2s
fping:
  count: 1
  interval_ms: 10
  timeout_ms: 500
  retry: 0
  # 透传给 fping 的额外参数，例如 ["-I", "eth0"]
  extra: []

logging:
  level: INFO                 # DEBUG / INFO / WARNING / ERROR
  dir: logs
  backup_days: 14
  format: json                # json（logstash json_lines）/ text（人类可读）

# 健康检查：docker HEALTHCHECK / k8s readinessProbe 调 `python monitor.py healthcheck`
# gateway 是 fping 探活的烟测地址，fping 能 ping 通它代表 fping 工具链 + 网络都 OK
healthcheck:
  gateway: 1.1.1.1            # Cloudflare DNS，公共可达

notify:
  enabled: true
  # 派发模式：默认异步（ThreadPoolExecutor），webhook 不会阻塞 fping 检测循环。
  async_dispatch: true
  max_workers: 4           # 异步派发时的线程池大小
  # 防抖：同一 (channel, host, kind) 在 N 秒内不重复发送，0 = 关闭。
  # 抖动场景推荐 60~300；过小可能丢失真实告警，过大可能漏报恢复。
  min_interval_s: 0
  # 渠道列表；每个渠道实现 notify_down / notify_recover
  channels:
    - type: dingtalk
      webhook_url: ""         # 钉钉机器人 Webhook，或通过 DINGTALK_WEBHOOK 环境变量传入
      secret: ""              # 机器人开启"加签"时必填，否则留空
      at_mobiles: []          # @指定手机号
      at_all: false           # 是否 @所有人
    # 内部布谷鸟告警平台占位，后续接入时再启用
    # - type: cuckoo
    #   ...
