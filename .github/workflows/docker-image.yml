name: Docker Image

# 只在打 ``v*.*.*`` 格式的 tag 时才会构建并推送镜像。
# 镜像 tag = git tag 原样（如 ``v1.2.3``），同时会同步打一个 ``latest``。
#
# 使用：
#   git tag v1.2.3
#   git push origin v1.2.3
on:
  push:
    tags: ["v*.*.*"]

env:
  # 阿里云容器镜像服务域名；vars 优先，便于在仓库层改默认 region
  REGISTRY: ${{ vars.ALIYUN_REGISTRY != '' && vars.ALIYUN_REGISTRY || secrets.ALIYUN_REGISTRY }}
  NAMESPACE: ${{ vars.ALIYUN_NAME_SPACE != '' && vars.ALIYUN_NAME_SPACE || secrets.ALIYUN_NAME_SPACE }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Resolve image name and tag
        id: image
        # tag push 事件里 ``github.ref_name`` 就是 tag 名称本身（如 ``v1.2.3``）。
        # on.push.tags 已经限定只接受 ``v*.*.*``，这里无需再做格式检查。
        run: |
          {
            echo "image=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/fping_monitor"
            echo "tag=${{ github.ref_name }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 两个 tag：git tag 原样 + latest
          # 不要 latest 就把第二行删掉
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=fping_monitor
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 用 GitHub Actions 自带缓存加速后续 build
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}

      - name: Image digest
        run: |
          {
            echo "### 镜像地址"
            echo
            echo "- \`${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}\`"
            echo "- \`${{ steps.image.outputs.image }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
