version: "3.8"

services:
  monitor:
    build: .
    image: fping-monitor:latest
    container_name: fping-monitor
    restart: unless-stopped
    volumes:
      # 配置目录整体挂载，往 conf/ 里加新 YAML（dev 模式、额外 hosts 文件）不用改 compose
      - ./conf:/app/conf:ro
      - ./state.db:/app/state.db
      - ./logs:/app/logs
    environment:
      # 钉钉 Webhook 通过环境变量传入，避免密钥写进 YAML
      DINGTALK_WEBHOOK: ${DINGTALK_WEBHOOK:-}
    # 默认就是常驻模式
    command: ["python", "monitor.py"]
