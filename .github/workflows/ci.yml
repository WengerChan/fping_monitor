name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install fping
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fping

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade-strategy only-if-needed -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  typecheck:
    runs-on: ubuntu-latest
    # 类型检查只在最新支持的 Python 上跑，避免老版本语法警告噪音。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            pip-typecheck-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade-strategy only-if-needed -r requirements-dev.txt

      - name: Run mypy
        run: mypy monitor.py scheduler.py detector.py notifier.py database.py models.py util.py
