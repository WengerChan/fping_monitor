name: Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "自定义镜像 tag（留空则用 short SHA）"
        required: false
        default: ""

env:
  # 阿里云容器镜像服务（个人版）默认域名；vars 优先，便于在仓库层改默认 region
  REGISTRY: ${{ vars.ALIYUN_REGISTRY != '' && vars.ALIYUN_REGISTRY || secrets.ALIYUN_REGISTRY }}
  NAMESPACE: ${{ vars.ALIYUN_NAMESPACE != '' && vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}

jobs:
  build:
    # PR 上只验证 build 能跑通，不推镜像
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        # 个人版/企业版都用 docker login 即可，CR 会按账号自动路由
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/fping_monitor
          tags: |
            # 语义化版本 tag：v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            # 默认 short SHA，便于回溯
            type=sha,prefix=
            # main 分支额外打 latest
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Apply manual tag override
        id: manual-tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        run: |
          {
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/fping_monitor:${{ github.event.inputs.tag }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.manual-tag.outputs.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # 用 GitHub 容器注册表做层缓存，下次 build 显著加速
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}

      - name: Image digest
        run: |
          echo "### 镜像地址" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
